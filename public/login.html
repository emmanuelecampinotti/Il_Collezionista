<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Il Collezionista</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        input { padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 0.8rem; background: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #34495e; }
        .toggle-btn { background: none; color: #2980b9; border: none; margin-top: 1rem; cursor: pointer; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="form-title">Accedi</h2>
        <!-- Usiamo JavaScript per gestire l'invio ed evitare comportamenti strani -->
        <form id="auth-form" onsubmit="handleSubmit(event)">
            <input type="text" id="username" name="username" placeholder="Nome utente" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Entra</button>
        </form>
        <button class="toggle-btn" type="button" onclick="toggleMode()">Non hai un account? Registrati</button>
    </div>

    <script>
        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const toggle = document.querySelector('.toggle-btn');

            if (isLogin) {
                title.innerText = 'Accedi';
                btn.innerText = 'Entra';
                toggle.innerText = 'Non hai un account? Registrati';
            } else {
                title.innerText = 'Registrati';
                btn.innerText = 'Crea Account';
                toggle.innerText = 'Hai già un account? Accedi';
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    window.location.href = '/';
                } else {
                    const text = await response.text();
                    alert("Errore: " + text);
                }
            } catch (err) {
                alert("Errore di connessione al server.");
            }
        }
    </script>
</body>
</html>
