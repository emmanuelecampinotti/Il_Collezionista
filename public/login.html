<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Il Collezionista</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        input { padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 0.8rem; background: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #34495e; }
        .toggle-btn { background: none; color: #2980b9; border: none; margin-top: 1rem; cursor: pointer; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="form-title">Accedi</h2>
        <form id="auth-form" action="/api/login" method="POST">
            <input type="text" name="username" placeholder="Nome utente" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Entra</button>
        </form>
        <button class="toggle-btn" onclick="toggleMode()">Non hai un account? Registrati</button>
    </div>

    <script>
        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const form = document.getElementById('auth-form');
            const btn = document.getElementById('submit-btn');
            const toggle = document.querySelector('.toggle-btn');

            if (isLogin) {
                title.innerText = 'Accedi';
                form.action = '/api/login';
                btn.innerText = 'Entra';
                toggle.innerText = 'Non hai un account? Registrati';
            } else {
                title.innerText = 'Registrati';
                form.action = '/api/register';
                btn.innerText = 'Crea Account';
                toggle.innerText = 'Hai già un account? Accedi';
            }
        }
    </script>
</body>
</html>
