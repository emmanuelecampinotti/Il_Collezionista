<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Collezionista di Profumi</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- HEADER SUPERIORE -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-700 cursor-pointer" onclick="switchTab('home')"><i class="fas fa-spray-can"></i> PerfumeHub</h1>
            
            <div class="relative w-1/3">
                <input type="text" id="globalSearchInput" placeholder="Cerca brand o profumo (es. Issey Miyake)..." class="w-full px-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="handleAutocomplete(this.value)" onkeypress="if(event.key === 'Enter') executeSearch(this.value)">
                <div id="autocompleteDropdown" class="absolute left-0 right-0 bg-white border mt-1 rounded-lg shadow-lg hidden z-50"></div>
            </div>

            <div class="relative">
                <button onclick="toggleUserMenu()" class="flex items-center space-x-2 focus:outline-none bg-indigo-50 px-3 py-1.5 rounded-full">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold" id="userInitial">U</div>
                    <span class="font-medium text-sm" id="userNameDisplay">Utente</span>
                    <i class="fas fa-chevron-down text-xs"></i>
                </button>
                <div id="userMenuDropdown" class="absolute right-0 mt-2 w-48 bg-white border rounded-lg shadow-xl hidden py-2 z-50">
                    <a href="#" onclick="openAccountModal()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-50"><i class="fas fa-user-cog mr-2"></i> I miei dati / Password</a>
                    <a href="/api/logout" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <nav class="bg-indigo-600 text-white shadow">
        <div class="max-w-7xl mx-auto px-4 flex space-x-6 py-2 text-sm font-medium">
            <button onclick="switchTab('home')" class="hover:underline"><i class="fas fa-home mr-1"></i> Home / Offerte</button>
            <button onclick="switchTab('library')" class="hover:underline"><i class="fas fa-book mr-1"></i> My Library</button>
            <button onclick="switchTab('wishlist')" class="hover:underline"><i class="fas fa-heart mr-1"></i> My Wishlist</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- TAB HOME & RISULTATI RICERCA -->
        <section id="tab-home" class="space-y-6">
            <div id="searchResultContainer" class="hidden bg-white p-6 rounded-xl shadow mb-6"></div>

            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6 rounded-xl shadow">
                <h2 class="text-2xl font-bold mb-2">Offerte Speciali del Giorno</h2>
                <p class="text-sm opacity-90">I profumi più cercati al miglior prezzo aggiornato online.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="specialOffersGrid">
                <div class="bg-white border rounded-xl p-4 shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded">Sconto 25%</span>
                        <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=300" alt="Profumo" class="w-full h-40 object-contain my-3 rounded">
                        <h3 class="font-bold text-lg">L'Eau d'Issey Pour Homme</h3>
                        <p class="text-xs text-gray-500 mb-2">Issey Miyake • 125 ml</p>
                        <p class="text-indigo-600 font-bold text-xl">€ 48,50 <span class="line-through text-gray-400 text-sm">€ 65,00</span></p>
                    </div>
                    <button onclick="searchAndShowDetails('L Eau d Issey Pour Homme')" class="mt-4 w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Visualizza Prezzi & Dettagli</button>
                </div>
            </div>
        </section>

        <!-- TAB MY LIBRARY -->
        <section id="tab-library" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800"><i class="fas fa-book mr-2"></i> La Mia Libreria Profumi</h2>
                <button onclick="startVoiceInput()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm flex items-center shadow hover:bg-green-700">
                    <i class="fas fa-microphone mr-2"></i> Aggiungi con Audio (+)
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="libraryGrid"></div>
        </section>

        <!-- TAB MY WISHLIST -->
        <section id="tab-wishlist" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-gray-800"><i class="fas fa-heart mr-2 text-pink-500"></i> My Wishlist</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="wishlistGrid"></div>
        </section>

    </main>

    <!-- MODALE ACCOUNT -->
    <div id="accountModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-96 shadow-lg relative">
            <h3 class="text-lg font-bold mb-4">Gestione Account</h3>
            <div class="space-y-4">
                <input type="text" id="updateUsername" class="w-full border p-2 rounded text-sm">
                <input type="password" id="updatePassword" class="w-full border p-2 rounded text-sm" placeholder="Nuova password">
                <div class="flex justify-between pt-2">
                    <button onclick="updateAccountData()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm">Salva</button>
                    <button onclick="deleteAccount()" class="bg-red-600 text-white px-4 py-2 rounded text-sm">Elimina Account</button>
                </div>
            </div>
            <button onclick="closeAccountModal()" class="absolute top-3 right-3 text-gray-400"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <script>
        let currentUser = "";

        async function initApp() {
            const res = await fetch('/api/current-user');
            const data = await res.json();
            if (data.loggedIn) {
                currentUser = data.username;
                document.getElementById('userNameDisplay').innerText = currentUser;
                document.getElementById('userInitial').innerText = currentUser.charAt(0).toUpperCase();
                loadUserPerfumes();
            } else {
                window.location.href = '/login.html';
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-library').classList.add('hidden');
            document.getElementById('tab-wishlist').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        function toggleUserMenu() {
            document.getElementById('userMenuDropdown').classList.toggle('hidden');
        }

        async function handleAutocomplete(val) {
            const dropdown = document.getElementById('autocompleteDropdown');
            if (!val || val.length < 2) { dropdown.classList.add('hidden'); return; }
            const res = await fetch(`/api/perfumes/autocomplete?q=${encodeURIComponent(val)}`);
            const suggestions = await res.json();
            if (suggestions.length > 0) {
                dropdown.innerHTML = suggestions.map(s => `<div class="px-4 py-2 text-sm hover:bg-gray-100 cursor-pointer" onclick="selectSuggestion('${s}')">${s}</div>`).join('');
                dropdown.classList.remove('hidden');
            } else {
                dropdown.classList.add('hidden');
            }
        }

        function selectSuggestion(val) {
            document.getElementById('globalSearchInput').value = val;
            document.getElementById('autocompleteDropdown').classList.add('hidden');
            executeSearch(val);
        }

        // Esegue la ricerca mostrando l'elenco dei risultati o dei profumi del brand
        async function executeSearch(query) {
            switchTab('home');
            const container = document.getElementById('searchResultContainer');
            container.classList.remove('hidden');
            container.innerHTML = `<p class="text-center py-6 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Ricerca profumi per "${query}" in corso...</p>`;

            const res = await fetch('/api/perfumes/search-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const list = await res.json();

            if (list.length === 0) {
                container.innerHTML = `<p class="text-center py-6 text-gray-500">Nessun profumo trovato per "${query}".</p>`;
                return;
            }

            container.innerHTML = `
                <h3 class="font-bold text-xl mb-4"><i class="fas fa-search mr-2"></i> Risultati per "${query}"</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    ${list.map(p => `
                        <div class="border rounded-lg p-3 bg-white shadow-sm flex flex-col justify-between">
                            <div>
                                <img src="${p.imageUrl}" class="w-full h-36 object-contain mb-2 rounded">
                                <h4 class="font-bold text-sm text-indigo-700">${p.name}</h4>
                                <p class="text-xs text-gray-500">${p.size} •${p.year}</p>
                            </div>
                            <button onclick="searchAndShowDetails('${p.name.replace(/'/g, "\\'")}')" class="mt-3 bg-indigo-600 text-white py-1.5 px-3 rounded text-xs hover:bg-indigo-700">Apri Scheda Definitiva</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Mostra la scheda definitiva di un singolo profumo con prezzi e opzioni
        async function searchAndShowDetails(query) {
            switchTab('home');
            const container = document.getElementById('searchResultContainer');
            container.classList.remove('hidden');
            container.innerHTML = `<p class="text-center py-6 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Caricamento scheda definitiva...</p>`;

            const res = await fetch('/api/perfumes/search-details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await res.json();
            const d = data.details;
            const prices = data.prices;

            container.innerHTML = `
                <button onclick="executeSearch('${d.brand}')" class="mb-4 text-sm text-indigo-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Torna ai risultati</button>
                <div class="flex flex-col md:flex-row gap-6">
                    <img src="${d.imageUrl}" class="w-48 h-48 object-contain mx-auto border rounded-lg p-2 bg-white">
                    <div class="flex-1 space-y-2">
                        <h2 class="text-2xl font-bold">${d.name}</h2>
                        <p class="text-sm text-gray-600"><b>Brand:</b> ${d.brand} | <b>Anno:</b> ${d.year} | <b>Naso:</b> ${d.perfumer}</p>
                        <p class="text-sm text-gray-700">${d.description}</p>
                        <p class="text-sm text-gray-700"><b>Note Olfattive:</b> Testa (${d.notes.top}) • Cuore (${d.notes.heart}) • Fondo (${d.notes.base})</p>
                        
                        <div class="pt-2 flex space-x-3">
                            <button onclick='addPerfumeToDB(${JSON.stringify(d).replace(/'/g, "&#39;")}, "library")' class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700"><i class="fas fa-plus mr-1"></i> Add to My Library</button>
                            <button onclick='addPerfumeToDB(${JSON.stringify(d).replace(/'/g, "&#39;")}, "wishlist")' class="bg-pink-600 text-white px-4 py-2 rounded text-sm hover:bg-pink-700"><i class="fas fa-heart mr-1"></i> Add to My Wishlist</button>
                        </div>
                    </div>
                </div>
                <div class="mt-6 border-t pt-4">
                    <h3 class="font-bold text-lg mb-3"><i class="fas fa-tags mr-2"></i> Confronto Prezzi Online (TrovaPrezzi & Store)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        ${prices.map(p => `
                            <div class="border p-3 rounded-lg flex justify-between items-center bg-gray-50">
                                <div>
                                    <p class="font-bold text-sm">${p.site}</p>
                                    <p class="text-indigo-600 font-bold">${p.price}</p>
                                </div>
                                <a href="${p.url}" target="_blank" class="bg-indigo-500 text-white px-3 py-1 rounded text-xs hover:bg-indigo-600">Vai</a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function addPerfumeToDB(perfume, listType) {
            perfume.listType = listType;
            const res = await fetch('/api/perfumes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(perfume)
            });
            if (res.ok) {
                alert(`Aggiunto alla tua ${listType === 'library' ? 'Library' : 'Wishlist'}!`);
                loadUserPerfumes();
            }
        }

        async function loadUserPerfumes() {
            const res = await fetch('/api/perfumes');
            const perfumes = await res.json();
            const libraryGrid = document.getElementById('libraryGrid');
            const wishlistGrid = document.getElementById('wishlistGrid');
            libraryGrid.innerHTML = '';
            wishlistGrid.innerHTML = '';

            perfumes.forEach(p => {
                const card = `
                    <div class="bg-white border rounded-lg p-3 shadow-sm flex flex-col justify-between">
                        <div>
                            <img src="${p.imageUrl}" class="w-full h-32 object-contain mb-2 rounded">
                            <h4 class="font-bold text-sm">${p.name}</h4>
                            <p class="text-xs text-gray-500">${p.brand || ''}</p>
                        </div>
                        <button onclick="deletePerfume('${p._id}')" class="mt-3 text-red-500 text-xs hover:underline text-left"><i class="fas fa-trash mr-1"></i> Rimuovi</button>
                    </div>
                `;
                if (p.listType === 'wishlist') wishlistGrid.innerHTML += card;
                else libraryGrid.innerHTML += card;
            });
        }

        async function deletePerfume(id) {
            if (confirm("Rimuovere questo profumo?")) {
                await fetch(`/api/perfumes/${id}`, { method: 'DELETE' });
                loadUserPerfumes();
            }
        }

        function startVoiceInput() {
            const spokenText = prompt("Dettatura vocale (es. 'Aggiungi Issey Miyake'):");
            if (spokenText) executeSearch(spokenText.replace(/aggiungi/gi, '').trim());
        }

        function openAccountModal() { document.getElementById('accountModal').classList.remove('hidden'); }
        function closeAccountModal() { document.getElementById('accountModal').classList.add('hidden'); }

        async function updateAccountData() {
            const newUsername = document.getElementById('updateUsername').value;
            const newPassword = document.getElementById('updatePassword').value;
            const res = await fetch('/api/user/update', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newUsername, newPassword })
            });
            if (res.ok) { alert("Aggiornato!"); closeAccountModal(); initApp(); }
        }

        async function deleteAccount() {
            if (confirm("Eliminare l'account?")) {
                const res = await fetch('/api/user/delete', { method: 'DELETE' });
                if (res.ok) window.location.href = '/login.html';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
